# Per-version properties. See https://stonecutter.kikugie.dev/wiki/config/properties
#
# Every dependency version here was checked against the upstream maven-metadata.xml.
# Do not bump one by guesswork: GeckoLib and JEI put the Minecraft version in the artifact
# id, and Curios changes its major version on every Minecraft release.

