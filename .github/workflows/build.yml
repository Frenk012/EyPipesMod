# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on:
  pull_request:
  # Branches with an open PR are already built by the pull_request event;
  # building them on push too queues two identical jobs per commit.
  push:
    branches: [main, neo-1.21.1]

# A newer commit on the same branch or PR makes the older run pointless.
concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # One job per Stonecutter node, so a broken port shows up by name and does not hide the others
    strategy:
      fail-fast: false
      matrix:
        node: [1.20.1-forge, 1.20.1-fabric, 1.21.1-neoforge, 1.21.1-fabric, 1.21.10-neoforge]
    name: build ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          # Forge 1.20.1 compiles with Java 17, the 1.21 nodes with Java 21
          java-version: |
            17
            21
          distribution: 'microsoft'
      - name: setup gradle (caches dependencies between runs)
        uses: gradle/actions/setup-gradle@v4
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      # The 1.20.1 data is converted from the 1.21.1 datagen output rather than generated;
      # fail if someone regenerated one without the other.
      - name: check 1.20.1 data is in sync
        if: startsWith(matrix.node, '1.20.1')
        run: |
          python3 tools/convert-generated-1.20.1.py
          git diff --exit-code -- src/generated/1.20.1
          test -z "$(git status --porcelain -- src/generated/1.20.1)"
      - name: build
        run: ./gradlew :${{ matrix.node }}:build
      - name: capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eypipes-${{ matrix.node }}
          path: versions/${{ matrix.node }}/build/libs/*.jar